name: Apply mobile upload stability patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-upload-stability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch mobile upload memory usage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()

          s = s.replace(
            'const VEHICLE_CLASSES = new Set(["bicycle", "car", "motorcycle", "bus", "truck"]);\nconst EMPTY_LANE',
            'const VEHICLE_CLASSES = new Set(["bicycle", "car", "motorcycle", "bus", "truck"]);\nfunction isMobileDevice() { return typeof navigator !== "undefined" && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent); }\nconst EMPTY_LANE'
          )

          old = '''  const startPerceptionModels = useCallback(async () => {\n    await ensureLaneModel();\n    setShow3D(true);\n    window.setTimeout(() => { void ensureObjectModel(); }, 1400);\n  }, [ensureLaneModel, ensureObjectModel]);'''
          new = '''  const startPerceptionModels = useCallback(async (source: SourceMode) => {\n    await ensureLaneModel();\n    const mobile = isMobileDevice();\n    if (mobile) {\n      setShow3D(false);\n      setStatus(source === "video" ? "YOLOP lanes active — mobile safe mode" : "YOLOP lanes active — mobile mode");\n      return;\n    }\n    setShow3D(true);\n    window.setTimeout(() => { void ensureObjectModel(); }, 1400);\n  }, [ensureLaneModel, ensureObjectModel]);'''
          if old not in s:
            raise SystemExit('startPerceptionModels block not found')
          s = s.replace(old, new)

          old = '''    const mobile = typeof navigator !== "undefined" && /iPhone|iPad|Android/i.test(navigator.userAgent);\n\n    const frame = (now: number) => {\n      if (!video.videoWidth || !video.videoHeight) { rafRef.current = requestAnimationFrame(frame); return; }\n      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }'''
          new = '''    const mobile = isMobileDevice();\n\n    const frame = (now: number) => {\n      if (!video.videoWidth || !video.videoHeight) { rafRef.current = requestAnimationFrame(frame); return; }\n      const maxOverlayWidth = mobile ? 960 : 1280;\n      const overlayWidth = Math.min(video.videoWidth, maxOverlayWidth);\n      const overlayHeight = Math.max(1, Math.round(overlayWidth * video.videoHeight / video.videoWidth));\n      if (canvas.width !== overlayWidth || canvas.height !== overlayHeight) { canvas.width = overlayWidth; canvas.height = overlayHeight; }'''
          if old not in s:
            raise SystemExit('canvas sizing block not found')
          s = s.replace(old, new)

          old = '''      ctx.clearRect(0, 0, canvas.width, canvas.height);\n      drawLaneOverlay(ctx, laneResultRef.current);\n      drawPredictions(ctx, predictionsRef.current);'''
          new = '''      ctx.clearRect(0, 0, canvas.width, canvas.height);\n      ctx.save();\n      ctx.scale(canvas.width / video.videoWidth, canvas.height / video.videoHeight);\n      drawLaneOverlay(ctx, laneResultRef.current);\n      drawPredictions(ctx, predictionsRef.current);\n      ctx.restore();'''
          if old not in s:
            raise SystemExit('overlay drawing block not found')
          s = s.replace(old, new)

          s = s.replace('void startPerceptionModels();', 'void startPerceptionModels("camera");', 1)
          idx = s.find('void startPerceptionModels();')
          if idx == -1:
            raise SystemExit('video startPerceptionModels call not found')
          s = s[:idx] + 'void startPerceptionModels("video");' + s[idx + len('void startPerceptionModels();'):]

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'fix: stabilize video uploads on mobile'
          git push origin HEAD:main
